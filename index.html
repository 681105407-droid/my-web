<style>
/* Layout: centered arcade title above a two-column stage-select panel, over a fixed low-res canvas sunset landscape; hero character stands bottom-left. Single committed night-arcade look. */
:root {
  color-scheme: dark;
  --night: #120a3a;
  --violet: #3b1f7a;
  --pink: #ff6fae;
  --gold: #ffd23f;
  --sky: #5cc8ff;
  --leaf: #6be07a;
  --ink: #1b1033;
  --lilac: #e5dcff;
  --frame: #7b5cd6;
  --font-display: 'Press Start 2P', ui-monospace, 'Courier New', monospace;
  --font-body: 'Kanit', 'Sarabun', system-ui, sans-serif;
  --font-util: 'VT323', ui-monospace, 'Courier New', monospace;
  --ground: 150px;
}

body {
  background: var(--night);
  color: var(--lilac);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.4;
  padding-inline: 16px;
  padding-block: 32px calc(var(--ground) + 32px);
  overflow-x: hidden;
}

#scene {
  position: fixed;
  top: 0;
  left: 0;
  z-index: 0;
  image-rendering: pixelated;
  pointer-events: none;
  background: var(--night);
}

.stage {
  position: relative;
  z-index: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 36px;
  max-width: 820px;
  margin-inline: auto;
}

/* ---------- Hero ---------- */
.hero {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 14px;
  min-width: 0;
  max-width: 100%;
}
.logo-row {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-wrap: wrap;
  gap: 18px;
  padding-inline: 12px;
}
.logo {
  margin: 0;
  font-family: var(--font-display);
  font-weight: 400;
  font-size: clamp(26px, 7.4vw, 68px);
  line-height: 1.1;
  color: #fff;
  letter-spacing: .02em;
  text-shadow:
    .07em .07em 0 var(--gold),
    .14em .14em 0 #3a1260,
    .21em .21em 0 var(--ink);
}
.spr { image-rendering: pixelated; flex: none; max-width: 100%; }
.spr.bob { animation: bob 1.2s steps(2, end) infinite; }
.tag-th {
  margin: 0;
  font-weight: 600;
  font-size: clamp(18px, 3.6vw, 26px);
  color: #fff;
  text-align: center;
  text-shadow: 2px 2px 0 var(--ink), 4px 4px 0 #3a1260;
}
.blink {
  margin: 0;
  font-family: var(--font-display);
  font-size: clamp(9px, 1.9vw, 12px);
  letter-spacing: .12em;
  color: var(--gold);
  text-shadow: 2px 2px 0 var(--ink);
  animation: blink 1.1s steps(1, end) infinite;
}
.spark {
  position: absolute;
  width: 6px;
  height: 6px;
  background: #fff;
  box-shadow: 6px 0 #fff, -6px 0 #fff, 0 6px #fff, 0 -6px #fff;
  animation: twinkle 1.6s steps(1, end) infinite;
}
.spark.s1 { top: -6px; left: 22%; }
.spark.s2 { top: 30%; right: 0; background: var(--gold); box-shadow: 6px 0 var(--gold), -6px 0 var(--gold), 0 6px var(--gold), 0 -6px var(--gold); animation-delay: .5s; }
.spark.s3 { bottom: -4px; left: 4%; background: var(--pink); box-shadow: 6px 0 var(--pink), -6px 0 var(--pink), 0 6px var(--pink), 0 -6px var(--pink); animation-delay: 1s; }

/* ---------- Panel ---------- */
.panel {
  position: relative;
  width: 100%;
  box-sizing: border-box;
  padding: 20px 22px 18px;
  background: rgba(18, 10, 58, .9);
  box-shadow:
    0 -6px 0 0 var(--ink), 0 6px 0 0 var(--ink), -6px 0 0 0 var(--ink), 6px 0 0 0 var(--ink),
    inset 0 0 0 4px var(--frame),
    inset 0 0 0 8px var(--night),
    0 14px 0 0 rgba(0, 0, 0, .35);
}
.panel-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 12px;
  padding: 6px 8px 18px;
}
.panel-title { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.panel-title h2 {
  margin: 0;
  font-family: var(--font-display);
  font-weight: 400;
  font-size: 13px;
  letter-spacing: .08em;
  color: var(--gold);
}
.panel-title span { font-weight: 500; font-size: 15px; color: var(--lilac); }

.snd {
  font-family: var(--font-display);
  font-size: 10px;
  letter-spacing: .06em;
  color: var(--ink);
  background: var(--sky);
  border: 0;
  border-radius: 0;
  padding: 12px 14px;
  min-height: 44px;
  cursor: pointer;
  box-shadow: 0 -3px 0 0 var(--ink), 0 3px 0 0 var(--ink), -3px 0 0 0 var(--ink), 3px 0 0 0 var(--ink), inset 3px 3px 0 0 #a6e4ff, inset -3px -3px 0 0 #2a94d6;
}
.snd[aria-pressed="false"] { background: #9a93b8; box-shadow: 0 -3px 0 0 var(--ink), 0 3px 0 0 var(--ink), -3px 0 0 0 var(--ink), 3px 0 0 0 var(--ink), inset 3px 3px 0 0 #c4bfdc, inset -3px -3px 0 0 #6a648a; }
.snd:focus-visible { outline: 4px dashed #fff; outline-offset: 6px; }

.menu {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 26px 24px;
  margin: 0;
  padding: 8px 8px 14px;
  list-style: none;
}
.menu li { min-width: 0; }

.btn {
  --c: #ff7ab8; --hi: #ffb3d6; --lo: #d9488f;
  position: relative;
  display: flex;
  align-items: center;
  gap: 14px;
  box-sizing: border-box;
  width: 100%;
  min-height: 76px;
  padding: 12px 16px;
  background: var(--c);
  color: var(--ink);
  text-decoration: none;
  text-align: left;
  font: inherit;
  border: 0;
  border-radius: 0;
  cursor: pointer;
  box-shadow:
    0 -4px 0 0 var(--ink), 0 4px 0 0 var(--ink), -4px 0 0 0 var(--ink), 4px 0 0 0 var(--ink),
    inset 4px 4px 0 0 var(--hi),
    inset -4px -4px 0 0 var(--lo),
    0 8px 0 0 var(--ink);
  transition: transform .08s steps(2, end), box-shadow .08s steps(2, end);
  -webkit-tap-highlight-color: transparent;
}
.btn:hover,
.btn:focus-visible {
  transform: translateY(-4px);
  box-shadow:
    0 -4px 0 0 var(--ink), 0 4px 0 0 var(--ink), -4px 0 0 0 var(--ink), 4px 0 0 0 var(--ink),
    inset 4px 4px 0 0 var(--hi),
    inset -4px -4px 0 0 var(--lo),
    0 12px 0 0 var(--ink);
}
.btn:focus-visible { outline: 4px dashed #fff; outline-offset: 10px; }
.btn:active {
  transform: translateY(2px);
  box-shadow:
    0 -4px 0 0 var(--ink), 0 4px 0 0 var(--ink), -4px 0 0 0 var(--ink), 4px 0 0 0 var(--ink),
    inset 4px 4px 0 0 var(--lo),
    inset -4px -4px 0 0 var(--hi),
    0 6px 0 0 var(--ink);
}
.btn::after {
  content: "";
  position: absolute;
  inset: 0;
  background: #fff;
  opacity: 0;
  pointer-events: none;
}
.btn.flash::after { animation: flash .26s steps(3, end); }

.badge {
  flex: none;
  display: grid;
  place-items: center;
  width: 40px;
  height: 40px;
  background: var(--ink);
  color: var(--hi);
  font-family: var(--font-display);
  font-size: 14px;
  box-shadow: inset 0 0 0 3px var(--lo);
}
.txt { display: flex; flex-direction: column; gap: 2px; min-width: 0; flex: 1; }
.name {
  font-weight: 600;
  font-size: 18px;
  line-height: 1.2;
  text-transform: uppercase;
  letter-spacing: .02em;
  overflow-wrap: anywhere;
}
.host {
  font-family: var(--font-util);
  font-size: 20px;
  line-height: 1;
  color: rgba(27, 16, 51, .8);
  overflow-wrap: anywhere;
}
.go { flex: none; width: 20px; height: 28px; fill: var(--ink); opacity: 0; transform: translateX(-8px); transition: opacity .08s steps(1, end), transform .08s steps(2, end); }
.btn:hover .go, .btn:focus-visible .go { opacity: 1; transform: none; }
.go.lock { opacity: 1; transform: none; }

.panel-foot {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 6px 16px;
  padding: 10px 8px 4px;
  font-family: var(--font-util);
  font-size: 22px;
  line-height: 1;
  color: var(--lilac);
}
.panel-foot b { font-weight: 400; color: var(--gold); }

/* ---------- Effects ---------- */
#fx { position: fixed; inset: 0; z-index: 50; pointer-events: none; overflow: hidden; }
.px {
  position: absolute;
  width: 8px;
  height: 8px;
  animation: burst .55s steps(6, end) forwards;
}
.toast {
  position: fixed;
  left: 50%;
  bottom: calc(var(--ground) + 18px);
  transform: translateX(-50%);
  z-index: 60;
  width: max-content;
  max-width: calc(100% - 32px);
  box-sizing: border-box;
  padding: 12px 16px;
  background: var(--ink);
  color: #fff;
  font-weight: 500;
  font-size: 16px;
  text-align: center;
  box-shadow: 0 -4px 0 0 var(--gold), 0 4px 0 0 var(--gold), -4px 0 0 0 var(--gold), 4px 0 0 0 var(--gold);
}

@keyframes bob { 0% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
@keyframes blink { 0%, 60% { opacity: 1; } 61%, 100% { opacity: 0; } }
@keyframes twinkle { 0%, 50% { opacity: 1; } 51%, 100% { opacity: 0; } }
@keyframes flash { 0% { opacity: .95; } 50% { opacity: .5; } 100% { opacity: 0; } }
@keyframes burst {
  0% { transform: translate(0, 0); opacity: 1; }
  100% { transform: translate(var(--dx), var(--dy)); opacity: 0; }
}

/* ---------- Responsive ---------- */
@media (max-width: 640px) {
  body { padding-block-start: 22px; }
  .stage { gap: 28px; }
  .panel { padding: 14px 12px 14px; }
  .panel-head { padding: 4px 4px 14px; }
  .menu { grid-template-columns: minmax(0, 1fr); gap: 20px; padding-inline: 4px; }
  .btn { min-height: 68px; padding: 10px 14px; }
  .name { font-size: 17px; }
  .badge { width: 36px; height: 36px; font-size: 12px; }
  .panel-foot { font-size: 20px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>

  ];

  var PAL = {

  ];

  function spr(c, rows, x, y, sc, flip) {
    for (var j = 0; j < rows.length; j++) {

    document.querySelectorAll('canvas[data-sprite]').forEach(function (cv) {

  function hex(h) { return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)]; }

      for (x = 0; x < W; x += 4) {
        if (((x >> 2) + (y >> 2)) % 2 === 0) { f.fillStyle = '#8a5a3a'; f.fillRect(x, y, 4, 4); }
      }
    }
    f.fillStyle = '#8be86a'; f.fillRect(0, gt, W, 1);
    f.fillStyle = '#4fb840'; f.fillRect(0, gt + 1, W, 2);
    f.fillStyle = '#2d7a2a'; f.fillRect(0, gt + 3, W, 1);
    for (x = 0; x < W; x++) {
      if (hash(x) % 7 === 0) { f.fillStyle = '#8be86a'; f.fillRect(x, gt - 1, 1, 1); }
    }
    /* fence */
    var wood = '#f0c987', dark = '#6b3f24';
    f.fillStyle = dark; f.fillRect(0, gt - 6, W, 3); f.fillRect(0, gt - 2, W, 3);
    f.fillStyle = wood; f.fillRect(0, gt - 7, W, 2); f.fillRect(0, gt - 3, W, 2);
    for (x = 5; x < W; x += 12) {
      f.fillStyle = dark; f.fillRect(x - 1, gt - 10, 5, 13);
      f.fillStyle = wood; f.fillRect(x, gt - 9, 3, 11);
      f.fillStyle = '#fff1c9'; f.fillRect(x, gt - 9, 1, 11);
    }
    /* bushes, trophy */
    [0.2, 0.5, 0.86].forEach(function (p) {
      spr(f, BUSH, Math.floor(W * p) - 16, gt - 4, 2, false);
    });
    spr(f, TROPHY, Math.floor(W * 0.68), gt - 3, 2, false);

    /* stars */
    var rnd = rng(7), count = Math.round(W * H / 1500), i;
    stars = [];
    var cols = ['#ffffff', '#ffe987', '#ffc2de'];
    for (i = 0; i < count; i++) {
      stars.push({ x: Math.floor(rnd() * W), y: Math.floor(rnd() * gt * 0.62), p: Math.floor(rnd() * 6), big: rnd() > 0.7, col: cols[Math.floor(rnd() * 3)] });
    }
    /* clouds */
    clouds = [];
    var n = Math.max(3, Math.round(W / 140));
    for (i = 0; i < n; i++) {
      clouds.push({ x0: rnd() * (W + 80), y: Math.floor(gt * (0.1 + rnd() * 0.45)), sc: rnd() > 0.5 ? 2 : 1, v: 2.5 + rnd() * 4 });
    }
    /* coins beside the hero */
    coinSpots = [[44, -26], [56, -32], [68, -26]].map(function (p) { return { x: p[0], dy: p[1] }; });
    coinSpots.push({ x: Math.floor(W * 0.58), dy: -22 }, { x: Math.floor(W * 0.93), dy: -26 });
  }

  function coin(c, x, y, ph) {
    var ws = [8, 6, 4, 2, 4, 6][ph % 6], x0 = x + 4 - ws / 2;
    c.fillStyle = PAL.k; c.fillRect(x0 - 1, y + 1, ws + 2, 8); c.fillRect(x0, y, ws, 10);
    c.fillStyle = PAL.y; c.fillRect(x0, y + 1, ws, 8);
    if (ws >= 4) { c.fillStyle = '#fff'; c.fillRect(x0 + 1, y + 2, 1, 3); }
  }

  function draw(t) {
    var i, s, c;
    ctx.drawImage(sky, 0, 0);
    var tick = Math.floor(t / 350);
    for (i = 0; i < stars.length; i++) {
      s = stars[i];
      var ph = (tick + s.p) % 6;
      if (ph === 0) continue;
      ctx.fillStyle = s.col;
      ctx.fillRect(s.x, s.y, 1, 1);
      if (ph === 4 && s.big) {
        ctx.fillRect(s.x - 1, s.y, 1, 1); ctx.fillRect(s.x + 1, s.y, 1, 1);
        ctx.fillRect(s.x, s.y - 1, 1, 1); ctx.fillRect(s.x, s.y + 1, 1, 1);
      }
    }
    for (i = 0; i < clouds.length; i++) {
      c = clouds[i];
      var span = W + 60;
      var cx = ((c.x0 + (reduce ? 0 : t / 1000 * c.v)) % span) - 30;
      spr(ctx, CLOUD, Math.floor(cx), c.y, c.sc, false);
    }
    ctx.drawImage(fg, 0, 0);
    var cph = Math.floor(t / 130);
    for (i = 0; i < coinSpots.length; i++) {
      var sp = coinSpots[i];
      var bobY = Math.floor(t / 420 + i) % 2 ? 1 : 0;
      coin(ctx, sp.x, gt + sp.dy - bobY, cph + i * 2);
    }
    /* hero */
    var bounce = Math.floor(t / 420) % 2 ? 1 : 0;
    var blink = (t % 3200) > 3000;
    var hy = gt + 8 - HERO.length * 2 - bounce;
    ctx.fillStyle = 'rgba(0,0,0,.25)'; ctx.fillRect(9, gt + 6, 24, 2);
    spr(ctx, blink ? HERO_BLINK : HERO, 9, hy, 2, false);
  }

  var last = 0, raf = 0;
  function loop(t) {
    raf = requestAnimationFrame(loop);
    if (t - last < 66) return;
    last = t; draw(t);
  }
  function start() {
    build();
    drawHeaderSprites();
    if (raf) cancelAnimationFrame(raf);
    if (reduce) draw(0); else raf = requestAnimationFrame(loop);
  }
  var rt;
  addEventListener('resize', function () {
    clearTimeout(rt);
    rt = setTimeout(function () {
      if (innerWidth !== lastW || Math.abs(innerHeight - lastH) > 120) start();
    }, 150);
  });

  /* ===================== Sound ===================== */
  var audio = null, muted = false;
  try { muted = localStorage.getItem('mywebs-muted') === '1'; } catch (e) {}
  function beep(freq, dur, vol) {
    if (muted) return;
    try {
      audio = audio || new (window.AudioContext || window.webkitAudioContext)();
      if (audio.state === 'suspended') audio.resume();
      var o = audio.createOscillator(), g = audio.createGain(), now = audio.currentTime;
      o.type = 'square'; o.frequency.setValueAtTime(freq, now);
      g.gain.setValueAtTime(vol, now);
      g.gain.exponentialRampToValueAtTime(0.0001, now + dur);
      o.connect(g); g.connect(audio.destination);
      o.start(now); o.stop(now + dur);
    } catch (e) {}
  }
  function hoverBlip() { if (audio && !muted) beep(440, 0.04, 0.025); }
  function clickSound() { beep(660, 0.07, 0.07); setTimeout(function () { beep(990, 0.1, 0.07); }, 70); }

  var snd = $('#snd');
  function paintSnd() { snd.textContent = muted ? 'SOUND OFF' : 'SOUND ON'; snd.setAttribute('aria-pressed', muted ? 'false' : 'true'); }
  snd.addEventListener('click', function () {
    muted = !muted; paintSnd();
    try { localStorage.setItem('mywebs-muted', muted ? '1' : '0'); } catch (e) {}
    if (!muted) beep(784, 0.08, 0.06);
  });
  paintSnd();

  /* ===================== Menu ===================== */
  var fx = $('#fx'), toast = $('#toast'), toastTimer;
  function showToast(msg) {
    toast.textContent = msg; toast.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toast.hidden = true; }, 2600);
  }
  function burst(x, y) {
    if (reduce) return;
    var cols = ['#ffd23f', '#ff6fae', '#ffffff', '#5cc8ff'];
    for (var i = 0; i < 14; i++) {
      var p = document.createElement('span');
      var ang = Math.random() * Math.PI * 2, d = 26 + Math.random() * 46;
      p.className = 'px';
      p.style.left = x - 4 + 'px'; p.style.top = y - 4 + 'px';
      p.style.background = cols[i % cols.length];
      p.style.setProperty('--dx', Math.round(Math.cos(ang) * d / 4) * 4 + 'px');
      p.style.setProperty('--dy', Math.round(Math.sin(ang) * d / 4) * 4 + 'px');
      p.addEventListener('animationend', function () { this.remove(); });
      fx.appendChild(p);
    }
  }
  function press(el, e) {
    el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash');
    var rect = el.getBoundingClientRect();
    var x = e && e.clientX ? e.clientX : rect.left + rect.width / 2;
    var y = e && e.clientY ? e.clientY : rect.top + rect.height / 2;
    burst(x, y); clickSound();
  }
  function hostOf(u) { try { return new URL(u).hostname; } catch (e) { return u; } }

  var NS = 'http://www.w3.org/2000/svg';
  function arrow() {
    var s = document.createElementNS(NS, 'svg');
    s.setAttribute('class', 'go'); s.setAttribute('viewBox', '0 0 5 7'); s.setAttribute('shape-rendering', 'crispEdges'); s.setAttribute('aria-hidden', 'true');
    [[0, 0, 1, 7], [1, 1, 1, 5], [2, 2, 1, 3], [3, 3, 1, 1]].forEach(function (r) {
      var el = document.createElementNS(NS, 'rect');
      el.setAttribute('x', r[0]); el.setAttribute('y', r[1]); el.setAttribute('width', r[2]); el.setAttribute('height', r[3]);
      s.appendChild(el);
    });
    return s;
  }
  function lockIcon() {
    var s = document.createElementNS(NS, 'svg');
    s.setAttribute('class', 'go lock'); s.setAttribute('viewBox', '0 0 7 8'); s.setAttribute('shape-rendering', 'crispEdges'); s.setAttribute('aria-hidden', 'true');
    [[2, 0, 3, 1], [1, 1, 1, 2], [5, 1, 1, 2], [0, 3, 7, 5]].forEach(function (r) {
      var el = document.createElementNS(NS, 'rect');
      el.setAttribute('x', r[0]); el.setAttribute('y', r[1]); el.setAttribute('width', r[2]); el.setAttribute('height', r[3]);
      s.appendChild(el);
    });
    return s;
  }

  var menu = $('#menu'), open = 0;
  LINKS.forEach(function (L, i) {
    var li = document.createElement('li');
    var locked = !L.url;
    var el = document.createElement(locked ? 'button' : 'a');
    el.className = 'btn' + (locked ? ' locked' : '');
    var tone = TONES[L.tone] || TONES.pink;
    el.style.setProperty('--c', tone[0]); el.style.setProperty('--hi', tone[1]); el.style.setProperty('--lo', tone[2]);
    if (locked) {
      el.type = 'button'; el.setAttribute('aria-disabled', 'true');
    } else {
      open++;
      el.href = L.url;
      el.target = OPEN_IN_SAME_TAB ? '_self' : '_blank';
      el.rel = 'noopener noreferrer';
    }
    var badge = document.createElement('span'); badge.className = 'badge'; badge.textContent = String(i + 1); badge.setAttribute('aria-hidden', 'true');
    var txt = document.createElement('span'); txt.className = 'txt';
    var name = document.createElement('span'); name.className = 'name'; name.textContent = L.name;
    var host = document.createElement('span'); host.className = 'host'; host.textContent = locked ? 'LOCKED · ยังไม่ได้ใส่ URL' : hostOf(L.url);
    txt.appendChild(name); txt.appendChild(host);
    el.appendChild(badge); el.appendChild(txt); el.appendChild(locked ? lockIcon() : arrow());
    el.addEventListener('pointerdown', function () { el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash'); });
    el.addEventListener('click', function (e) {
      press(el, e);
      if (locked) showToast('ด่านนี้ยังล็อกอยู่ ยังไม่ได้ใส่ URL');
    });
    el.addEventListener('pointerenter', hoverBlip);
    el.addEventListener('focus', hoverBlip);
    li.appendChild(el); menu.appendChild(li);
  });
  $('#count').innerHTML = 'UNLOCKED <b>' + open + '/' + LINKS.length + '</b>';

  document.addEventListener('keydown', function (e) {
    var keys = { ArrowDown: 1, ArrowRight: 1, ArrowUp: -1, ArrowLeft: -1 };
    if (!(e.key in keys)) return;
    var items = Array.prototype.slice.call(document.querySelectorAll('.btn'));
    var idx = items.indexOf(document.activeElement);
    if (idx === -1 && keys[e.key] < 0) return;
    e.preventDefault();
    var next = idx === -1 ? 0 : (idx + keys[e.key] + items.length) % items.length;
    items[next].focus();
  });

  if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { /* fonts affect DOM only */ });
  start();
})();
</script>

</body></html>
